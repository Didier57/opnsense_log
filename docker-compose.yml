services:
  opnsense-log-analyzer:
    image: ghcr.io/didier57/opnsense-log-analyzer:latest
    container_name: opnsense-log-analyzer
    restart: unless-stopped
    # To build locally from this repository instead of pulling the image:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # NOTE: do not add a healthcheck here, and never use curl for it.
    # The image already ships a Python healthcheck; curl is deliberately absent.
    ports:
      - "${WEB_PORT:-8080}:8080"
      # Multi-instance: each OPNsense gets its own syslog port (5140, 5141, ...).
      # A contiguous range is published so every instance is reachable.
      - "${SYSLOG_PORT_START:-5140}-${SYSLOG_PORT_END:-5160}:${SYSLOG_PORT_START:-5140}-${SYSLOG_PORT_END:-5160}/udp"
      - "${SYSLOG_PORT_START:-5140}-${SYSLOG_PORT_END:-5160}:${SYSLOG_PORT_START:-5140}-${SYSLOG_PORT_END:-5160}/tcp"
    environment:
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8080"
      # First syslog port; extra instances use the following ports.
      SYSLOG_PORT: "${SYSLOG_PORT:-5140}"
      SYSLOG_PROTOCOL: "${SYSLOG_PROTOCOL:-udp}"
      DATA_DIR: "/data"
      LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-30}"
      RETENTION_CHECK_INTERVAL_MIN: "${RETENTION_CHECK_INTERVAL_MIN:-60}"
      DUCKDB_MEMORY_LIMIT: "${DUCKDB_MEMORY_LIMIT:-1GB}"
      DUCKDB_THREADS: "${DUCKDB_THREADS:-2}"
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
      TOKEN_EXPIRE_MINUTES: "${TOKEN_EXPIRE_MINUTES:-10080}"
      DISPLAY_TIMEZONE: "${DISPLAY_TIMEZONE:-Europe/Luxembourg}"
      SYSLOG_TIMEZONE: "${SYSLOG_TIMEZONE:-Europe/Luxembourg}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      HOSTNAME_LOOKUP_TTL_MIN: "${HOSTNAME_LOOKUP_TTL_MIN:-1440}"
      # Detection engine, OPNsense SSH/API, blocking, SMTP and ntfy are
      # configured from the web UI and stored in the data volume.
    volumes:
      - opnsense_logs:/data
      # Bind-mount alternative (e.g. NAS): replace the line above with
      # - /volume1/docker/opnsense_logs:/data

volumes:
  opnsense_logs:
