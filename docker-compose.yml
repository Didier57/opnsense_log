services:
  opnsense-log-analyzer:
    image: ghcr.io/didier57/opnsense-log-analyzer:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opnsense-log-analyzer
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
      - "${SYSLOG_PORT:-5140}:5140/udp"
      - "${SYSLOG_PORT:-5140}:5140/tcp"
    environment:
      WEB_PORT: "8080"
      SYSLOG_PORT: "${SYSLOG_PORT:-5140}"
      SYSLOG_PROTOCOL: "${SYSLOG_PROTOCOL:-udp}"
      DATA_DIR: "/data"
      LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-30}"
      AUTH_ENABLED: "${AUTH_ENABLED:-true}"
      AUTH_USERNAME: "${AUTH_USERNAME:-admin}"
      AUTH_PASSWORD: "${AUTH_PASSWORD:-admin}"
      AUTH_PASSWORD_HASH: "${AUTH_PASSWORD_HASH:-}"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
      DISPLAY_TIMEZONE: "${DISPLAY_TIMEZONE:-Europe/Luxembourg}"
      SYSLOG_TIMEZONE: "${SYSLOG_TIMEZONE:-Europe/Luxembourg}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      HOSTNAME_LOOKUP_TTL_MIN: "${HOSTNAME_LOOKUP_TTL_MIN:-1440}"
      # Detection engine (all also editable from the web UI, which wins).
      DETECTION_ENABLED: "${DETECTION_ENABLED:-true}"
      DETECTION_INTERVAL_SEC: "${DETECTION_INTERVAL_SEC:-60}"
      DETECTION_PORTSCAN_PORTS: "${DETECTION_PORTSCAN_PORTS:-20}"
      DETECTION_PORTSCAN_WINDOW_SEC: "${DETECTION_PORTSCAN_WINDOW_SEC:-60}"
      DETECTION_BRUTEFORCE_COUNT: "${DETECTION_BRUTEFORCE_COUNT:-20}"
      DETECTION_BRUTEFORCE_WINDOW_SEC: "${DETECTION_BRUTEFORCE_WINDOW_SEC:-120}"
      DETECTION_SPIKE_THRESHOLD: "${DETECTION_SPIKE_THRESHOLD:-300}"
      DETECTION_SPIKE_WINDOW_SEC: "${DETECTION_SPIKE_WINDOW_SEC:-60}"
      # Email notifications (optional defaults; configure from the web UI).
      SMTP_ENABLED: "${SMTP_ENABLED:-false}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURITY: "${SMTP_SECURITY:-starttls}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-Analyseur de logs OPNsense}"
      SMTP_TO: "${SMTP_TO:-}"
    volumes:
      - opnsense_logs:/data

volumes:
  opnsense_logs:
